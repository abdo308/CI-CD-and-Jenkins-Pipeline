version: "3.9"

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  auth:
    build: ./services/auth
    environment:
      PORT: "8081"
      DATABASE_URL: "postgres://appuser:apppass@db:5432/appdb?sslmode=disable"
      AUTH_SECRET: "devsecret"
      TOKEN_TTL_MINUTES: "60"
    depends_on:
      - db
    ports:
      - "8081:8081"

  api:
    build: ./services/api
    environment:
      PORT: "8082"
      DATABASE_URL: "postgres://appuser:apppass@db:5432/appdb?sslmode=disable"
      AUTH_URL: "http://auth:8081"
    depends_on:
      - db
      - auth
    ports:
      - "8082:8082"

  frontend:
    build: ./frontend
    environment:
      VITE_AUTH_URL: "http://localhost:8081"
      VITE_API_URL: "http://localhost:8082"
    depends_on:
      - api
      - auth
    ports:
      - "5173:5173"

volumes:
  dbdata:
